[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-streaming-json-patcher"
version = "0.1.0"
description = "Real-time incremental JSON-Patch (RFC 6902) stream parser and accumulator for low-latency agent tool progress notifications"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mcp-streaming-json-patcher = "mcp_streaming_json_patcher.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_streaming_json_patcher*"]
